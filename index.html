<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale = 1.0"/>
    <title> 🚀 Mars Habitat Simulator </title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header>
        <h1> 🚀 Mars Habitat Simulator </h1>
        <p class="subtitle"> Mission Control - Deep Space Operations </p>
    </header>
    <main>
        <div id="controls">
            <h2> Mission Parameters </h2>

            <label> Crew Size </label>
            <input type="number" id="crew" value ="4" min="1" max="100"/>

            <label> Solar Panel Output</label>
            <input type="number" id="solar" value ="50"/>

            <label> Starting Water </label>
            <input type="number" id="water" value="10000"/>

            <label> Starting Oxygen </label>
            <input type="number" id="oxygen" value="5000"/>

            <label> Starting Food </label>
            <input type="number" id="food" value="2000"/>

            <label> Starting Energy </label>
            <input type="number" id="energy" value="1000"/>

            <label> Simulation Days </label>
            <input type="number" id="days" value="30"/>
            
            <button id = "runBtn" onclick="runSim()">▶ Run Simulation</button>

            <label> Speed </label>
            <select id ="speedControl">
                <option value ="slow"> Slow </option>
                <option value ="normal"> Normal </option>
                <option value ="fast"> Fast </option>
            </select>
            <button id = "pauseBtn" onclick="pauseSim()">⏸ Pause </button>
        </div>

        <section id = "dashboard">

            <div id="resource-bars">
                <h2> Resources </h2>
                <div class="bar-row"><span>💧 Water</span><div class = "bar-wrap"><div class ="bar" id="bar-water"></div></div><span id="val-water">---</span></div>
                <div class="bar-row"><span>🌬 Oxygen</span><div class = "bar-wrap"><div class ="bar" id="bar-oxygen"></div></div><span id="val-oxygen">---</span></div>
                <div class="bar-row"><span>🍎 Food</span><div class = "bar-wrap"><div class ="bar" id="bar-food"></div></div><span id="val-food">---</span></div>
                <div class="bar-row"><span>⚡ Energy</span><div class = "bar-wrap"><div class ="bar" id="bar-energy"></div></div><span id="val-energy">---</span></div>
                <div class="bar-row"><span>😊 Morale</span><div class = "bar-wrap"><div class ="bar" id="bar-morale"></div></div><span id="val-morale">---</span></div>
            </div>
            <div id ="mission-status">
                <span id ="day-counter">Day 0</span>
                <span id="status-badge">STANDBY</span>
            </div>
            <div id ="event-log">
                <h2>📋 Mission Log </h2>
                <div id="log-entries"></div>
            </div>
        </section>
    </main>
    <section id="chart-section">
        <h2>📊 Resource History</h2>
        <canvas id="resourceChart"></canvas>
    </section>
    <section id="nasa-panel">
    <h2>🛰 NASA Live Data</h2>
    <div id ="mars-weather">Loading Mars weather...</div>
    <div id ="rover-photo-wrap">
    <div id="rover-text"></div>
        <img id = "rover-photo" src = "" alt="Mars Rover Photo" style="display:none"/>
    </div>
    <div id = "asteroid-alert"></div>
    </section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="events.js"></script>
  <script src="simulation.js"></script>
  <script src="nasa.js"></script>
  <script src="app.js"></script>
</body>
</html>
